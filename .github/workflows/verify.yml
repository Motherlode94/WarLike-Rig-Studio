name: Verify WarLike Rig Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check studio.js
          node --check rig-core.mjs
          node --check rig-editor.mjs
          node --check menu.js
          node --check rig-tester.mjs
      - name: Automated rig tests
        run: node --test tests/*.test.mjs
      - name: Verify app files
        run: |
          test -s index.html
          test -s studio.js
          test -s rig-core.mjs
          grep -q 'id="viewport"' index.html
          grep -q 'id="rig"' index.html
          grep -q 'id="jointSelect"' index.html
          grep -q 'id="jointX"' index.html
          grep -q 'id="mirrorJoint"' index.html
          grep -q 'id="motionPlay"' index.html
          grep -q 'id="motionTime"' index.html
          grep -q 'id="menuToggle"' index.html
          grep -q 'data-page-target="joints"' index.html
